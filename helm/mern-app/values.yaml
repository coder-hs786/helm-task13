frontend:
  replicaCount: 3

  image:
    repository: abdelazez66/ecommerce-frontend
    tag: v1
    pullPolicy: IfNotPresent

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi


backend:
  replicaCount: 1

  image:
    repository: abdelazez66/ecommerce-backend
    tag: v1
    pullPolicy: IfNotPresent

  containerPort: 5000

  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi


mongodb:
  image:
    repository: mongo
    tag: "7"
    pullPolicy: IfNotPresent

  replicaCount: 1

  port: 27017

  database: ecommerce

  storage:
    size: 1Gi


ingress:
  enabled: true

  className: nginx

  host: ecommerce.local

  frontendPath: /
  backendPath: /api


hpa:
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

  backend:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

